{% extends "base.html" %}

{% block head %}
<style>
  .spinner-wrapper {
    text-align: center;
    padding: 50px;
  }
  .spinner-border {
    width: 3rem;
    height: 3rem;
  }
</style>
{% endblock %}

{% block content %}
<!-- Loading Spinner -->
<div id="loading" class="spinner-wrapper">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p>Analyzing river data with GenAI... Please wait.</p>
</div>

<!-- Analysis Results -->
<div id="analysis-result" class="analysis-box" style="display:none;">
  <h4>🧠 GenAI Insights:</h4>
  <div id="analysis-content"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Fetch GenAI analysis
  async function fetchGenAIAnalysis() {
    try {
      const response = await fetch('/get_genai_analysis');
      if (response.ok) {
        const analysisHtml = await response.text();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('analysis-result').style.display = 'block';
        document.getElementById('analysis-content').innerHTML = analysisHtml;
      } else {
        throw new Error('Failed to fetch analysis');
      }
    } catch (error) {
      document.getElementById('loading').innerHTML = '<p>Error fetching GenAI analysis. Please try again later.</p>';
    }
  }

  // Call the function to fetch GenAI analysis once the page loads
  window.onload = function() {
    fetchGenAIAnalysis();
  };
</script>
{% endblock %}
